name: release

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --workspace --locked
      - run: cargo test --release --workspace
      - name: Package
        shell: bash
        run: |
          mkdir -p dist
          cp target/release/omapaper target/release/omapaperd target/release/omapaper-mcp target/release/omapaper-canvas dist/ 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        with:
          name: omapaper-${{ matrix.os }}
          path: dist/
