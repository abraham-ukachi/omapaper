<?xml version="1.0" encoding="UTF-8"?>
<!--
  OmaPaper's mark. An accent tile for the "O", a page folded at the corner for
  the "Paper". Drawn with the Tokyo Night accent (#7aa2f7); the desktop entry
  and the cockpit tint the same shapes to the live Omarchy theme.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#9dbdff"/>
      <stop offset="0.55" stop-color="#7aa2f7"/>
      <stop offset="1" stop-color="#5b83d9"/>
    </linearGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#171b2b"/>
      <stop offset="1" stop-color="#0f1220"/>
    </linearGradient>
    <mask id="sheet">
      <rect x="16" y="16" width="480" height="480" rx="108" fill="#ffffff"/>
      <!-- the folded corner is cut away -->
      <path d="M398 16 H496 V114 Z" fill="#000000"/>
    </mask>
  </defs>

  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#tile)" mask="url(#sheet)"/>

  <!-- the flap folded over the cut corner -->
  <path d="M398 16 L496 114 H398 Z" fill="#ffffff" fill-opacity="0.32"/>
  <path d="M398 16 L496 114" stroke="#ffffff" stroke-opacity="0.35" stroke-width="2"/>

  <!-- the O -->
  <circle cx="252" cy="268" r="106" fill="none" stroke="url(#ink)" stroke-width="48"/>
</svg>
